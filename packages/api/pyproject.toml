[project]
name = "math-assistant-api"
version = "1.0.0"
description = "FastAPI platform layer for the AI Game Mathematics Assistant"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "email-validator>=2.2,<3",
    "fastapi>=0.115,<1",
    "pwdlib[argon2]>=0.2,<1",
    "pydantic-settings>=2.6,<3",
    "pyjwt>=2.10,<3",
    "celery>=5.4,<6",
    "redis>=5.2,<6",
    "reportlab>=4.2,<5",
    "runtime-core",
    "sqlalchemy[asyncio]>=2.0,<3",
    "prometheus-client>=0.21,<1",
    "sentry-sdk[fastapi]>=2.19,<3",
    "structlog>=24.4,<25",
    "uvicorn[standard]>=0.32,<1",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20,<1",
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "pytest-cov>=6,<7",
    "ruff>=0.8,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
runtime-core = { path = "../runtime_core", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers", "--strict-config", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
